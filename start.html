<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IC Process</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: #f4f6f8;
      color: #17202a;
    }

    #status {
      display: none;
      padding: 14px 20px;
      background: #fff3cd;
      color: #664d03;
      border-bottom: 1px solid #ffecb5;
    }

    #status.error {
      background: #f8d7da;
      color: #842029;
      border-color: #f5c2c7;
    }

    #status.success {
      background: #d1e7dd;
      color: #0f5132;
      border-color: #badbcc;
    }

    #authOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef2f6;
    }

    #authOverlay[hidden] { display: none; }

    .auth-card {
      width: min(430px, 100%);
      padding: 34px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(23, 54, 93, .2);
      text-align: center;
    }

    .auth-card h1 {
      margin: 0 0 10px;
      color: #17365d;
      font-size: 24px;
    }

    .auth-card p {
      margin: 0 0 24px;
      color: #536273;
      line-height: 1.5;
    }

    #loginButton {
      padding: 11px 24px;
      border: 0;
      border-radius: 4px;
      background: #17365d;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    #loginButton:disabled {
      cursor: wait;
      opacity: .65;
    }

    #platformFrame {
      display: none;
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="status">
    <span id="statusText">Reading request details…</span>
  </div>

  <div id="authOverlay">
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <h1 id="authTitle">Sign in to continue</h1>
      <p id="authMessage">Checking your Intelligent Capture session…</p>
      <button id="loginButton" type="button" hidden>Sign in</button>
    </div>
  </div>

  <iframe id="platformFrame" title="IC Process application"></iframe>

  <script>
    "use strict";

    const statusElement = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const authOverlay = document.getElementById("authOverlay");
    const authMessage = document.getElementById("authMessage");
    const loginButton = document.getElementById("loginButton");
    const platformFrame = document.getElementById("platformFrame");
    let metadataPayload = {};
    let metadataFields = [];
    let frameObserver = null;

    const defaultDisplayFields = [
      { name: "appRef", label: "Application Reference" },
      { name: "documentTypeCode", label: "Document Type" },
      { name: "userId", label: "User ID" },
      { name: "processCode", label: "Process Code" },
      { name: "processDesc", label: "Process Description" },
      { name: "issuedAt", label: "Issued At", type: "timestamp" },
      { name: "expiry", label: "Expiry", type: "timestamp" },
      { name: "env", label: "Environment" },
      { name: "nonce", label: "Nonce" }
    ];

    function showError(message) {
      statusText.textContent = message;
      statusElement.className = "error";
      statusElement.style.display = "block";
    }

    function showStatus(message, className = "") {
      statusText.textContent = message;
      statusElement.className = className;
      statusElement.style.display = "block";
    }

    function base64UrlDecode(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const remainder = normalized.length % 4;

      if (remainder === 1) {
        throw new Error("The JWE contains an invalid Base64url segment.");
      }

      const padded = normalized + (remainder === 2 ? "==" : remainder === 3 ? "=" : "");
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function pemToPkcs8(pem) {
      if (typeof pem !== "string" || !pem.includes("BEGIN PRIVATE KEY")) {
        throw new Error("metadata.json does not contain a PKCS#8 private key.");
      }

      const base64 = pem
        .replace(/-----BEGIN PRIVATE KEY-----/g, "")
        .replace(/-----END PRIVATE KEY-----/g, "")
        .replace(/\s/g, "");

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes.buffer;
    }

    async function decryptJwe(compactToken, privateKeyPem) {
      const parts = compactToken.split(".");

      if (parts.length !== 5) {
        throw new Error(`Expected a five-part JWE token, but received ${parts.length} part(s).`);
      }

      const [headerSegment, encryptedKeySegment, ivSegment, ciphertextSegment, tagSegment] = parts;
      const decoder = new TextDecoder();
      const encoder = new TextEncoder();

      let protectedHeader;
      try {
        protectedHeader = JSON.parse(decoder.decode(base64UrlDecode(headerSegment)));
      } catch {
        throw new Error("The protected JWE header is not valid JSON.");
      }

      if (protectedHeader.alg !== "RSA-OAEP-256" || protectedHeader.enc !== "A256GCM") {
        throw new Error(
          `Unsupported JWE algorithms: alg=${protectedHeader.alg || "missing"}, enc=${protectedHeader.enc || "missing"}.`
        );
      }

      const privateKey = await crypto.subtle.importKey(
        "pkcs8",
        pemToPkcs8(privateKeyPem),
        { name: "RSA-OAEP", hash: "SHA-256" },
        false,
        ["decrypt"]
      );

      const cek = await crypto.subtle.decrypt(
        { name: "RSA-OAEP" },
        privateKey,
        base64UrlDecode(encryptedKeySegment)
      );

      if (cek.byteLength !== 32) {
        throw new Error(`The decrypted AES content-encryption key is ${cek.byteLength} bytes; expected 32.`);
      }

      const aesKey = await crypto.subtle.importKey(
        "raw",
        cek,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const ciphertext = base64UrlDecode(ciphertextSegment);
      const tag = base64UrlDecode(tagSegment);
      const ciphertextAndTag = new Uint8Array(ciphertext.length + tag.length);
      ciphertextAndTag.set(ciphertext, 0);
      ciphertextAndTag.set(tag, ciphertext.length);

      const plaintext = await crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: base64UrlDecode(ivSegment),
          additionalData: encoder.encode(headerSegment),
          tagLength: tag.length * 8
        },
        aesKey,
        ciphertextAndTag
      );

      return decoder.decode(plaintext);
    }

    function formatValue(value, type) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      if (type === "timestamp") {
        const date = new Date(Number(value) * 1000);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
      }

      if (typeof value === "object") {
        return JSON.stringify(value);
      }

      return String(value);
    }

    function displayMetadata(payload, fields) {
      metadataPayload = payload || {};
      metadataFields = fields || defaultDisplayFields;
      injectMetadataIntoFrame();
    }

    function injectMetadataIntoFrame() {
      let frameDocument;
      try {
        frameDocument = platformFrame.contentDocument;
      } catch {
        return;
      }

      if (!frameDocument?.body) return;

      const titlebar = frameDocument.querySelector("cp-titlebar");
      if (!titlebar) return;

      let strip = frameDocument.getElementById("ic-request-metadata");
      if (!strip) {
        const style = frameDocument.createElement("style");
        style.id = "ic-request-metadata-style";
        style.textContent = `
          #ic-request-metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px 22px;
            padding: 11px 18px 12px;
            background: #17365d;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .14);
          }
          #ic-request-metadata .ic-request-field { min-width: 0; }
          #ic-request-metadata .ic-request-label {
            display: block;
            color: #cbd8e8;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: .04em;
            text-transform: uppercase;
          }
          #ic-request-metadata .ic-request-value {
            display: block;
            margin-top: 2px;
            overflow-wrap: anywhere;
          }
        `;
        frameDocument.head.appendChild(style);

        strip = frameDocument.createElement("section");
        strip.id = "ic-request-metadata";
        strip.setAttribute("aria-label", "Request details");
        titlebar.insertAdjacentElement("afterend", strip);
      }

      const renderKey = JSON.stringify(metadataFields.map(field => [
        field.name,
        field.label,
        field.type,
        metadataPayload[field.name]
      ]));
      if (strip.dataset.renderKey === renderKey) return;
      strip.dataset.renderKey = renderKey;

      strip.replaceChildren();
      for (const field of metadataFields) {
        const container = frameDocument.createElement("div");
        container.className = "ic-request-field";

        const label = frameDocument.createElement("span");
        label.className = "ic-request-label";
        label.textContent = field.label || field.name;

        const value = frameDocument.createElement("span");
        value.className = "ic-request-value";
        value.textContent = formatValue(metadataPayload[field.name], field.type);

        container.append(label, value);
        strip.appendChild(container);
      }
    }

    function loadPlatform(iframeUrl, sessionToken) {
      const target = new URL(iframeUrl || "/", window.location.origin);
      if (sessionToken) {
        target.searchParams.set("session", sessionToken);
      }

      if (target.pathname === window.location.pathname) {
        throw new Error("The configured iframe URL points back to start.html and would cause recursion.");
      }

      platformFrame.src = target.href;
      platformFrame.style.display = "block";
    }

    platformFrame.addEventListener("load", () => {
      try {
        frameObserver?.disconnect();
        injectMetadataIntoFrame();

        const frameDocument = platformFrame.contentDocument;
        if (frameDocument?.body) {
          frameObserver = new MutationObserver(injectMetadataIntoFrame);
          frameObserver.observe(frameDocument.body, { childList: true, subtree: true });
        }
      } catch (error) {
        console.warn("Unable to inject request details into IC:", error);
      }
    });

    async function hasActiveSession(authCheckUrl) {
      try {
        const target = new URL(authCheckUrl, window.location.origin);

        const response = await fetch(target.href, {
          method: "GET",
          credentials: "include",
          cache: "no-store",
          redirect: "manual"
        });

        return response.status === 200 && response.type !== "opaqueredirect";
      } catch (error) {
        console.warn("Authentication check failed:", error);
        return false;
      }
    }

    function buildLoginUrl(loginUrl) {
      return new URL(loginUrl || "/", window.location.origin).href;
    }

    function openLoginPopup(loginUrl) {
      const width = Math.min(1100, window.screen.availWidth - 40);
      const height = Math.min(800, window.screen.availHeight - 80);
      const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - width) / 2));
      const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - height) / 2));
      const features = [
        "popup=yes",
        `width=${width}`,
        `height=${height}`,
        `left=${left}`,
        `top=${top}`,
        "resizable=yes",
        "scrollbars=yes"
      ].join(",");

      return window.open(buildLoginUrl(loginUrl), "icAuthentication", features);
    }

    function waitForAuthentication(authCheckUrl, loginWindow) {
      return new Promise((resolve, reject) => {
        const startedAt = Date.now();
        const timeoutMs = 5 * 60 * 1000;

        const timer = window.setInterval(async () => {
          if (await hasActiveSession(authCheckUrl)) {
            window.clearInterval(timer);
            try {
              if (loginWindow && !loginWindow.closed) loginWindow.close();
            } catch { /* The popup may still be on the Azure origin. */ }
            resolve();
            return;
          }

          if (Date.now() - startedAt >= timeoutMs) {
            window.clearInterval(timer);
            reject(new Error("Sign-in was not completed within five minutes."));
          }
        }, 2000);
      });
    }

    async function ensureAuthenticated(configuration) {
      const authCheckUrl = configuration.platform?.authCheckUrl || "/cp-rest/about";
      const loginUrl = configuration.platform?.loginUrl || configuration.platform?.iframeUrl || "/";

      authOverlay.hidden = false;
      authMessage.textContent = "Checking your Intelligent Capture session…";
      loginButton.hidden = true;
      if (await hasActiveSession(authCheckUrl)) {
        authOverlay.hidden = true;
        return;
      }

      authMessage.textContent = "Authentication is required. Sign in securely to continue.";
      loginButton.hidden = false;

      return new Promise((resolve, reject) => {
        let authenticationInProgress = false;

        const beginLogin = async () => {
          if (authenticationInProgress) return;
          authenticationInProgress = true;
          loginButton.disabled = true;
          loginButton.textContent = "Opening sign-in…";

          const loginWindow = openLoginPopup(loginUrl);

          if (!loginWindow) {
            authenticationInProgress = false;
            loginButton.disabled = false;
            loginButton.textContent = "Sign in";
            authMessage.textContent = "The sign-in window was blocked. Allow popups and try again.";
            return;
          }

          loginButton.textContent = "Waiting for sign-in…";
          authMessage.textContent = "Complete sign-in in the separate window. This page will continue automatically.";
          try {
            await waitForAuthentication(authCheckUrl, loginWindow);
            authOverlay.hidden = true;
            resolve();
          } catch (error) {
            authenticationInProgress = false;
            loginButton.disabled = false;
            loginButton.textContent = "Try again";
            authMessage.textContent = error.message;
          }
        };

        loginButton.onclick = beginLogin;
      });
    }

    async function initialize() {
      const sessionToken = new URLSearchParams(window.location.search).get("session");
      let configuration = {
        platform: { iframeUrl: "/" },
        displayFields: defaultDisplayFields
      };
      let fields = defaultDisplayFields;
      let preparationError = null;

      try {
        const response = await fetch("./metadata.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Unable to load metadata.json (HTTP ${response.status}).`);
        }

        configuration = await response.json();
        fields = configuration.displayFields?.length
          ? configuration.displayFields
          : defaultDisplayFields;
      } catch (error) {
        console.error(error);
        preparationError = error;
      }

      try {
        await ensureAuthenticated(configuration);
      } catch (authenticationError) {
        console.error(authenticationError);
        showError(`Unable to authenticate: ${authenticationError.message}`);
        return;
      }

      let payload = {};
      let decryptionError = preparationError;

      if (!decryptionError) {
        try {
          if (!window.crypto?.subtle) {
            throw new Error("This browser does not support Web Crypto. Use the page over HTTPS in a modern browser.");
          }

          if (!sessionToken) {
            throw new Error("The required 'session' query parameter is missing.");
          }

          const plaintext = await decryptJwe(sessionToken, configuration.jwe?.privateKeyPkcs8Pem);
          try {
            payload = JSON.parse(plaintext);
          } catch {
            throw new Error("The decrypted JWE payload is not valid JSON.");
          }
        } catch (error) {
          console.error(error);
          decryptionError = error;
        }
      }

      // Values become available only after authentication succeeds.
      displayMetadata(payload, fields);

      try {
        loadPlatform(configuration.platform?.iframeUrl || "/", sessionToken);
        if (decryptionError) {
          showError(`Request details could not be decrypted, but IC was loaded: ${decryptionError.message}`);
        } else {
          statusElement.style.display = "none";
        }
      } catch (iframeError) {
        console.error(iframeError);
        showError(`Unable to load Intelligent Capture: ${iframeError.message}`);
      }
    }

    initialize();
  </script>
</body>
</html>
